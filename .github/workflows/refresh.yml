name: Discover route sources

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh.py
      - scripts/review_publisher_archives.py
      - scripts/publish_publisher_coverage.py
      - .github/workflows/refresh.yml
      - data/feeds.json

permissions:
  contents: read

concurrency:
  group: source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read public directories and collect candidates
        run: python3 scripts/refresh.py
      - name: Restore publisher review history
        uses: actions/cache/restore@v4
        with:
          path: .cache/publisher-archive-state.json
          key: atlas-publisher-review-v1-${{ github.run_id }}
          restore-keys: atlas-publisher-review-v1-
      - name: Review editorial text from verified publishers
        run: |
          python3 scripts/review_publisher_archives.py \
            --public-coverage .cache/publisher-review-coverage.json \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Save deduplicated publisher review history
        uses: actions/cache/save@v4
        with:
          path: .cache/publisher-archive-state.json
          key: atlas-publisher-review-v1-${{ github.run_id }}
      - name: Keep the source-read receipt and candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-candidates
          path: |
            .cache/refresh.json
            .cache/publisher-review.json
            .cache/publisher-review-coverage.json
          include-hidden-files: true
          retention-days: 30

  publish_receipt:
    if: github.ref == 'refs/heads/main'
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: atlas-candidates
          path: ${{ runner.temp }}/atlas-receipt
      - name: Validate the report against the current catalog
        run: |
          python3 scripts/publish_publisher_coverage.py \
            "$RUNNER_TEMP/atlas-receipt/publisher-review-coverage.json" \
            "$GITHUB_RUN_ID"
      - name: Publish the validated receipt
        run: |
          git add -- data/publisher-review-coverage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Publish source discovery report ${GITHUB_RUN_ID}"
          git push origin HEAD:refs/heads/main
